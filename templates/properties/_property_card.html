<div class="col-md-6 col-lg-4">
    <a href="{% url 'property_detail' p.pk %}" class="text-decoration-none text-dark">
        <div class="card property-card h-100">
            <div class="position-relative">
                {% if p.main_image %}
                    <img src="{{ p.main_image.url }}" class="card-img-top" alt="{{ p.title }}">
                {% else %}
                    <div class="card-img-top bg-light d-flex align-items-center justify-content-center">
                        <i class="bi bi-house fs-1 text-muted"></i>
                    </div>
                {% endif %}
                <span class="badge rounded-pill {% if p.deal_type == 'sale' %}badge-sale{% else %}badge-rent{% endif %} position-absolute top-0 start-0 m-3 px-3 py-2">
                    {{ p.get_deal_type_display }}
                </span>
                <span class="badge rounded-pill bg-white text-dark position-absolute top-0 end-0 m-3 px-3 py-2">
                    {{ p.category.name }}
                </span>
            </div>
            <div class="card-body p-4">
                <div class="price fs-5 mb-1">${{ p.price }}</div>
                <h6 class="fw-bold mb-1">{{ p.title }}</h6>
                <p class="text-muted small mb-3">
                    <i class="bi bi-geo-alt"></i> {{ p.address }}
                </p>
                <div class="d-flex gap-3 text-muted small border-top pt-3">
                    <span><i class="bi bi-door-open"></i> {{ p.rooms }} кімн.</span>
                    <span><i class="bi bi-arrows-fullscreen"></i> {{ p.area_sqm }} м²</span>
                </div>
            </div>
        </div>
    </a>
</div>
