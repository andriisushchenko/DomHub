<form method="get" action="{% url 'property_list' %}" class="filter-card text-start mx-auto">
    <div class="row g-3">
        <div class="col-lg-5">
            <label>Локація або назва</label>
            <input type="text" name="q" value="{{ q }}" class="form-control form-control-lg"
                   placeholder="Київ, Львів, Печерськ...">
        </div>
        <div class="col-md-4 col-lg">
            <label>Угода</label>
            <select name="deal_type" class="form-select form-select-lg">
                <option value="">Всі</option>
                <option value="sale" {% if current_deal_type == 'sale' %}selected{% endif %}>Продаж</option>
                <option value="rent" {% if current_deal_type == 'rent' %}selected{% endif %}>Оренда</option>
            </select>
        </div>
        <div class="col-md-4 col-lg">
            <label>Тип об'єкта</label>
            <select name="category" class="form-select form-select-lg">
                <option value="">Будь-який</option>
                {% for cat in categories %}
                <option value="{{ cat.id }}" {% if current_category == cat.id|stringformat:"s" %}selected{% endif %}>{{ cat.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4 col-lg">
            <label>Кімнат</label>
            <select name="rooms" class="form-select form-select-lg">
                <option value="">Будь-яка</option>
                <option value="1" {% if current_rooms == '1' %}selected{% endif %}>1</option>
                <option value="2" {% if current_rooms == '2' %}selected{% endif %}>2</option>
                <option value="3" {% if current_rooms == '3' %}selected{% endif %}>3</option>
                <option value="4" {% if current_rooms == '4' %}selected{% endif %}>4+</option>
            </select>
        </div>
    </div>

    <hr class="my-4" style="border-color: var(--border);">

    <div class="d-flex flex-wrap align-items-center gap-2">
        <label class="mb-0 me-1">Бюджет ($):</label>
        <input type="number" name="price_min" value="{{ price_min }}" class="form-control"
               placeholder="Від" style="width: 120px;">
        <span class="text-muted">—</span>
        <input type="number" name="price_max" value="{{ price_max }}" class="form-control"
               placeholder="До" style="width: 120px;">

        <select name="sort" class="form-select ms-lg-auto" style="width: auto;">
            <option value="new" {% if current_sort == 'new' %}selected{% endif %}>Спочатку нові</option>
            <option value="cheap" {% if current_sort == 'cheap' %}selected{% endif %}>Спочатку дешевші</option>
            <option value="expensive" {% if current_sort == 'expensive' %}selected{% endif %}>Спочатку дорожчі</option>
        </select>
        <a href="{% url 'property_list' %}" class="btn btn-link text-decoration-none fw-semibold text-dark">Скинути</a>
        <button type="submit" class="btn btn-accent px-4 py-2">
            <i class="bi bi-search"></i> Застосувати
        </button>
    </div>
</form>
