{% extends 'base.html' %}
{% block title %}Видалити — DomHub{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger p-4 text-center">
            <h2 class="text-danger mb-3">Видалити об'єкт?</h2>
            <p class="lead">{{ object.title }}</p>
            <p class="text-muted">Цю дію не можна скасувати.</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger btn-lg me-2">Так, видалити</button>
                <a href="{% url 'property_list' %}" class="btn btn-secondary btn-lg">Скасувати</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
