{% extends 'base.html' %}
{% block title %}Вхід — DomHub{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card p-4">
            <h2 class="fw-bold mb-4 text-center">Вхід</h2>
            <form method="post" class="plain-form">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                    <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                    {% endif %}
                </div>
                {% endfor %}
                <button type="submit" class="btn btn-accent btn-lg w-100">Увійти</button>
                <hr>
                <p class="text-center text-muted mb-0">
                    Немає акаунту? <a href="{% url 'register' %}">Зареєструватися</a>
                </p>
            </form>
        </div>
    </div>
</div>
{% endblock %}
