name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Тести
    runs-on: ubuntu-latest
    steps:
      - name: Отримати код
        uses: actions/checkout@v4

      - name: Встановити Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Встановити залежності
        run: pip install -r requirements.txt

      - name: Unit-тести (QA3)
        run: python manage.py test

      - name: Встановити браузер для E2E
        run: python -m playwright install --with-deps chromium

      - name: E2E-тести (QA2)
        run: python -m pytest

  deploy:
    name: Деплой на Render
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Запустити деплой
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$DEPLOY_HOOK"
